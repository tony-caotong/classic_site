<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="常用工具与可视化入口">
  <title>Home · Classic Site</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #10243e;
      --muted: #607087;
      --paper: #f4f1e9;
      --card: rgba(255, 255, 255, 0.76);
      --line: rgba(16, 36, 62, 0.13);
      --blue: #326ce5;
      --blue-dark: #2055bb;
      --blue-soft: #e8efff;
      --shadow: 0 24px 70px rgba(25, 51, 83, 0.13);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--paper);
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 82% 12%, rgba(50, 108, 229, 0.13), transparent 28rem),
        linear-gradient(rgba(16, 36, 62, 0.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(16, 36, 62, 0.045) 1px, transparent 1px),
        var(--paper);
      background-size: auto, 48px 48px, 48px 48px, auto;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      width: min(1180px, calc(100% - 48px));
      min-height: 100vh;
      margin: 0 auto;
      padding: 28px 0 64px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 28px;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      color: var(--ink);
      font-size: 14px;
      font-weight: 750;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .brand-mark {
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      border-radius: 10px;
      color: white;
      background: var(--ink);
      box-shadow: 0 8px 20px rgba(16, 36, 62, 0.2);
    }

    .brand-mark svg {
      width: 18px;
      height: 18px;
    }

    .home-label {
      padding: 7px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.45);
      font-size: 11px;
      font-weight: 750;
      letter-spacing: 0.14em;
    }

    main {
      padding-top: clamp(72px, 12vh, 132px);
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 18px;
      color: var(--blue-dark);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      width: 28px;
      height: 2px;
      content: "";
      background: var(--blue);
    }

    h1 {
      max-width: 760px;
      margin: 0;
      font-size: clamp(44px, 7vw, 82px);
      font-weight: 780;
      letter-spacing: -0.055em;
      line-height: 0.98;
    }

    .intro {
      max-width: 590px;
      margin: 26px 0 0;
      color: var(--muted);
      font-size: clamp(16px, 2vw, 19px);
      line-height: 1.7;
    }

    .section-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: clamp(64px, 10vh, 104px) 0 18px;
    }

    .section-heading h2 {
      margin: 0;
      font-size: 14px;
      font-weight: 780;
      letter-spacing: 0.06em;
    }

    .section-heading span {
      color: var(--muted);
      font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
      font-size: 12px;
    }

    .shortcut {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 220px;
      min-height: 276px;
      overflow: hidden;
      border: 1px solid rgba(50, 108, 229, 0.22);
      border-radius: 26px;
      color: inherit;
      background: var(--card);
      box-shadow: var(--shadow);
      text-decoration: none;
      isolation: isolate;
      transition: transform 180ms ease, border-color 180ms ease, box-shadow 180ms ease;
      backdrop-filter: blur(18px);
    }

    .shortcut::after {
      position: absolute;
      inset: 0;
      z-index: -1;
      content: "";
      background: linear-gradient(115deg, transparent 52%, rgba(50, 108, 229, 0.09));
    }

    .shortcut:hover {
      border-color: rgba(50, 108, 229, 0.48);
      box-shadow: 0 30px 80px rgba(25, 51, 83, 0.18);
      transform: translateY(-4px);
    }

    .shortcut:focus-visible {
      outline: 3px solid rgba(50, 108, 229, 0.38);
      outline-offset: 4px;
    }

    .shortcut-content {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: space-between;
      padding: clamp(30px, 5vw, 48px);
    }

    .tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 11px;
      border-radius: 999px;
      color: var(--blue-dark);
      background: var(--blue-soft);
      font-size: 12px;
      font-weight: 750;
    }

    .tag::before {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      content: "";
      background: var(--blue);
      box-shadow: 0 0 0 4px rgba(50, 108, 229, 0.12);
    }

    .shortcut h3 {
      margin: 24px 0 10px;
      font-size: clamp(25px, 4vw, 40px);
      letter-spacing: -0.035em;
      line-height: 1.13;
    }

    .shortcut p {
      max-width: 620px;
      margin: 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.65;
    }

    .open-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 28px;
      color: var(--blue-dark);
      font-size: 14px;
      font-weight: 780;
    }

    .open-link svg {
      width: 17px;
      transition: transform 180ms ease;
    }

    .shortcut:hover .open-link svg {
      transform: translateX(4px);
    }

    .visual {
      position: relative;
      min-height: 100%;
      overflow: hidden;
      border-left: 1px solid rgba(50, 108, 229, 0.16);
      background: var(--ink);
    }

    .visual::before,
    .visual::after {
      position: absolute;
      width: 180px;
      height: 180px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 50%;
      content: "";
    }

    .visual::before {
      top: -80px;
      right: -70px;
    }

    .visual::after {
      bottom: -105px;
      left: -80px;
    }

    .network {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    footer {
      display: flex;
      justify-content: space-between;
      gap: 24px;
      margin-top: 32px;
      color: var(--muted);
      font-size: 12px;
    }

    @media (max-width: 720px) {
      .page {
        width: min(100% - 32px, 1180px);
        padding-top: 18px;
      }

      header {
        padding-bottom: 18px;
      }

      main {
        padding-top: 64px;
      }

      h1 {
        font-size: clamp(42px, 14vw, 64px);
      }

      .shortcut {
        grid-template-columns: 1fr;
      }

      .visual {
        min-height: 150px;
        border-top: 1px solid rgba(50, 108, 229, 0.16);
        border-left: 0;
      }

      footer {
        flex-direction: column;
        gap: 6px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 6.5 12 2l8 4.5v9L12 20l-8-4.5z"/>
            <path d="m8.5 9 3.5 2 3.5-2M12 11v4"/>
          </svg>
        </span>
        Classic Site
      </div>
      <span class="home-label">HOME / 01</span>
    </header>

    <main>
      <p class="eyebrow">Knowledge &amp; Tools</p>
      <h1>从这里，快速抵达。</h1>
      <p class="intro">汇集架构地图、技术视图与常用工具。选择下方入口，开始探索。</p>

      <div class="section-heading">
        <h2>快捷入口</h2>
        <span>01 item</span>
      </div>

      <a class="shortcut" href="kubernetes-ai-gateway-kind-map.html" aria-label="打开 Kubernetes AI Gateway Kind 归属地图">
        <div class="shortcut-content">
          <div>
            <span class="tag">交互地图</span>
            <h3>Kubernetes AI Gateway<br>Kind 归属地图</h3>
            <p>梳理 Kubernetes、Gateway API、Envoy Gateway 与 AI Gateway 生态中的资源 Kind、所属项目及依赖关系。</p>
          </div>
          <span class="open-link">
            打开地图
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
              <path d="M4 10h12M11 5l5 5-5 5"/>
            </svg>
          </span>
        </div>

        <div class="visual" aria-hidden="true">
          <svg class="network" viewBox="0 0 220 276" fill="none">
            <g stroke="#7da4ff" stroke-opacity=".48" stroke-width="1.2">
              <path d="M35 54 104 91l69-43M104 91l8 91M35 54l12 142 65-14 61-134 12 154-73-20"/>
              <path d="m47 196 138 6M35 54l138-6" stroke-dasharray="4 5"/>
            </g>
            <g fill="#326ce5" stroke="#b8ccff" stroke-width="2">
              <circle cx="35" cy="54" r="8"/>
              <circle cx="173" cy="48" r="7"/>
              <circle cx="104" cy="91" r="11"/>
              <circle cx="47" cy="196" r="7"/>
              <circle cx="112" cy="182" r="10"/>
              <circle cx="185" cy="202" r="8"/>
            </g>
            <g fill="#fff">
              <circle cx="35" cy="54" r="2"/>
              <circle cx="173" cy="48" r="2"/>
              <circle cx="104" cy="91" r="3"/>
              <circle cx="47" cy="196" r="2"/>
              <circle cx="112" cy="182" r="3"/>
              <circle cx="185" cy="202" r="2"/>
            </g>
          </svg>
        </div>
      </a>
    </main>

    <footer>
      <span>Built for clear thinking.</span>
      <span>Classic Site · Home</span>
    </footer>
  </div>
</body>
</html>
